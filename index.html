<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keynesianismen – interaktiva övningar</title><style>
:root{--ink:#382514;--muted:#766352;--blue:#c45b16;--bg:#fff7ef;--line:#ecd9c7;--green:#126a4a;--red:#a72b36}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}header{background:#fff0dd;color:#382514;padding:35px 20px}header .wrap,main{max-width:830px;margin:auto}h1{font-size:clamp(42px,6.5vw,60px);font-weight:900;letter-spacing:-.035em;line-height:1.12;margin:8px 0}header p{opacity:.88;margin:5px 0}.tag{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.8}main{padding:26px 16px 70px}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:clamp(20px,4vw,34px);box-shadow:0 12px 32px #6e350e14}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;margin-top:24px}.tile{border:1px solid var(--line);border-radius:15px;padding:25px;text-align:left;background:#fff;cursor:pointer;color:var(--ink);font:inherit}.tile:hover,.tile:focus-visible{outline:2px solid #f2a15b}.tile h2{font-size:24px;margin:10px 0}.tile p{color:var(--muted)}.pill{display:inline-block;background:#fff0dd;color:#a6460b;padding:4px 12px;border-radius:50px;font-size:13px;font-weight:750}.hidden{display:none!important}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.scorelive{margin-left:auto;font-weight:800;color:#9a450d;background:#fff0dd;border:1px solid #eec9a5;border-radius:10px;padding:7px 12px;white-space:nowrap}.barbg{height:9px;background:#f4e4d5;border-radius:12px;margin:17px 0 25px;overflow:hidden}.bar{height:100%;background:#c45b16;width:0;transition:width .2s}.story{background:#fff6eb;border-left:4px solid #edab6b;border-radius:8px;padding:17px;margin:18px 0;color:#63472e}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:13px;margin:9px 0;cursor:pointer}.option:has(input:checked){background:#fff0dd;border-color:#c45b16}.option input{margin-top:6px;accent-color:#c45b16}button{font:inherit;cursor:pointer}.primary,.secondary{border:0;border-radius:11px;padding:12px 20px;font-weight:750}.primary{background:#c45b16;color:white}.secondary{background:#f9e8d5;color:#693b1b}.primary:disabled{opacity:.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:23px}.feedback{padding:17px;border-radius:12px;margin-top:18px}.good{background:#e7f6ee;color:var(--green)}.bad{background:#fff0f0;color:var(--red)}.feedback p{margin:7px 0}.field{margin:13px 0;display:flex;align-items:center;gap:13px;justify-content:space-between;flex-wrap:wrap}.field label{flex:1;min-width:190px}.field select,.field input{font:inherit;padding:9px;border:1px solid #d8bda4;border-radius:9px;background:white;max-width:100%;min-width:135px}.field input{width:180px}.reviewitem{border-top:1px solid var(--line);padding:14px 0}.reviewitem p{margin:4px 0}.muted{color:var(--muted)}@media(max-width:500px){.field{align-items:stretch}.field label{min-width:100%}.field select,.field input{width:100%}}#home{max-width:1160px}main{max-width:1200px}#quiz,#end{max-width:830px;margin-left:auto;margin-right:auto}#home .tiles{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:0}#home .tile{padding:20px;min-width:0}#home .tile h2{font-size:clamp(19px,2.3vw,24px)}@media(max-width:760px){#home .tiles{grid-template-columns:1fr}#home .tile{padding:22px}} </style></head><body><header><div class="wrap"><div class="tag">SAMHÄLLSKUNSKAP 2 · EKONOMISK TEORI OCH POLITIK</div><h1>Keynesianism</h1><p>Öva begrepp, samband och ekonomiska beslut – en fråga i taget med direkt feedback.</p></div></header><main><div id="home" class="panel"><div class="tiles"><button class="tile" onclick="start('review')"><span class="pill">DEL 1</span><h2>Repetera</h2><p>Vad minns du från genomgången?</p><strong>10 frågor →</strong></button><button class="tile" onclick="start('cases')"><span class="pill">DEL 2</span><h2>Övningsuppgifter</h2><p>Öva på att tillämpa teorin</p><strong>12 uppgifter →</strong></button><button class="tile" onclick="start('tf')"><span class="pill">DEL 3</span><h2>Sant &amp; Falskt</h2><p>Vilka påståenden är korrekta och vilka är felaktiga?</p><strong>10 frågor →</strong></button></div></div><div id="quiz" class="hidden"><div class="top"><button class="secondary" onclick="home()">← Till startsidan</button><strong id="counter"></strong><span id="liveScore" class="scorelive" aria-live="polite">Antal rätt: 0 av 0</span></div><div class="barbg"><div id="bar" class="bar"></div></div><div class="panel"><div class="tag" id="sectiontag" style="color:#c45b16"></div><h2 id="heading"></h2><div id="story" class="story hidden"></div><p id="task"></p><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="primary" onclick="check()">Rätta mitt svar</button><button id="next" class="primary hidden" onclick="next()">Nästa fråga →</button></div></div></div><div id="end" class="panel hidden"><span class="pill">Klart!</span><h2 id="score"></h2><p id="message"></p><div class="actions"><button class="primary" onclick="start(mode)">Gör om (nya alternativ)</button><button class="secondary" onclick="home()">Till startsidan</button></div><h2>Facit och förklaringar</h2><div id="key"></div></div></main><script>
const DATA={"review":[{"q":"Vilken ekonomisk kris bidrog till att keynesianismen växte fram?","a":["Oljekrisen under 1970-talet","Den stora depressionen under 1930-talet","Finanskrisen 2008"],"correct":1,"why":"Keynes idéer växte fram under den stora depressionen på 1930-talet."},{"q":"Sant eller falskt: Enligt Keynes kan hög arbetslöshet bero på att efterfrågan i ekonomin är för låg.","a":["Sant","Falskt"],"correct":0,"why":"För låg efterfrågan gör att företag säljer mindre och behöver färre anställda."},{"q":"Vad innebär expansiv finanspolitik?","a":["Staten minskar sina utgifter för att stärka statsbudgeten","Staten höjer skatterna för att minska hushållens konsumtion","Staten ökar sina utgifter för att stimulera efterfrågan"],"correct":2,"why":"Expansiv finanspolitik syftar till att öka efterfrågan, till exempel genom offentliga satsningar."},{"q":"Vad menas med multiplikatoreffekten?","a":["En statlig satsning kan skapa inkomster och konsumtion i flera led","Varje statlig satsning leder till exakt dubbelt så många arbetstillfällen","Staten får automatiskt tillbaka hela sin investering genom skatter"],"correct":0,"why":"Nya jobb skapar inkomster, konsumtion och ytterligare efterfrågan i andra delar av ekonomin."},{"q":"Sant eller falskt: Kontracyklisk stabiliseringspolitik innebär att staten ska stimulera ekonomin både i hög- och lågkonjunktur.","a":["Sant","Falskt"],"correct":1,"why":"Kontracyklisk politik går emot konjunkturen: stimulera vid lågkonjunktur och bromsa vid högkonjunktur."},{"q":"Vad bör staten göra under en högkonjunktur enligt keynesiansk stabiliseringspolitik?","a":["Öka sina utgifter för att skapa ännu fler arbetstillfällen","Minska efterfrågan genom restriktiv finanspolitik","Öka efterfrågan för att motverka risken för arbetslöshet"],"correct":1,"why":"Vid högkonjunktur kan staten dämpa efterfrågan för att minska risken för inflation."},{"q":"Staten bygger nya järnvägar under en lågkonjunktur. Varför kan detta minska arbetslösheten även utanför byggbranschen?","a":["Alla arbetslösa får automatiskt arbete inom staten","Företagen behöver inte längre betala skatt och kan därför anställa","Byggarbetarnas löner leder till ökad konsumtion som skapar efterfrågan i andra branscher"],"correct":2,"why":"Byggarbetarna spenderar sina löner, vilket kan skapa fler jobb i andra branscher: multiplikatoreffekten."},{"q":"Vad kan bli en konsekvens av att staten ökar sina utgifter under en lågkonjunktur?","a":["Budgetunderskott och växande statsskuld","Budgetöverskott och sjunkande statsskuld","Minskad efterfrågan och lägre konsumtion"],"correct":0,"why":"När statens utgifter överstiger inkomsterna uppstår budgetunderskott, som kan öka statsskulden."},{"q":"Vilket samband illustrerar Phillipskurvan i genomgången?","a":["Hög arbetslöshet hänger samman med hög inflation","Låg arbetslöshet hänger samman med hög inflation","Låg arbetslöshet hänger alltid samman med låg inflation"],"correct":1,"why":"Den förenklade Phillipskurvan visar ett samband mellan låg arbetslöshet och högre inflation."},{"q":"Ett land har hög arbetslöshet och låg efterfrågan. Regeringen väljer att minska statens utgifter för att undvika budgetunderskott. Hur skulle en keynesian sannolikt kritisera beslutet?","a":["Det riskerar att minska efterfrågan ytterligare och förvärra arbetslösheten","Det leder främst till att inflationen stiger och att ekonomin överhettas","Det är rätt åtgärd eftersom staten bör spara mest under lågkonjunkturer"],"correct":0,"why":"Nedskärningar under lågkonjunktur kan försvaga efterfrågan ytterligare och öka arbetslösheten."}],"cases":[{"title":"Ett land fattar beslut","kind":"multi","items":["Efterfrågan ökar och arbetslösheten minskar","Inflationen stiger","Staten går med budgetöverskott","Efterfrågan minskar och arbetslösheten ökar"],"correct":[0,1],"explanation":"Satsningarna kan öka efterfrågan och minska arbetslösheten. En ökad efterfrågan kan också bidra till högre inflation, särskilt om produktionen inte kan öka i samma takt. Budgetöverskott följer inte automatiskt av ökade utgifter.","story":"En regering ökar sina investeringar under en lågkonjunktur. Nya byggprojekt ger fler människor arbete, och när lönerna betalas ut kan hushållen köpa mer från andra företag. Regeringen hoppas på en bredare återhämtning i ekonomin.","task":"Vilka TVÅ konsekvenser kan regeringens satsningar få? Välj två av fyra alternativ."},{"title":"Ett annat ekonomiskt läge","kind":"single","items":["A. Lägre inflation och automatiskt minskad statsskuld","B. Högre inflation och växande statsskuld","C. Lägre efterfrågan och ökad arbetslöshet"],"correct":1,"explanation":"När efterfrågan ökar snabbare än produktionen kan priserna stiga. Om staten finansierar satsningar med underskott kan statsskulden växa. Effekterna beror på ekonomins läge.","story":"Ett land har redan hög efterfrågan och brist på arbetskraft. Trots detta beslutar regeringen om stora nya satsningar och skattesänkningar. Företagen får fler beställningar men har svårt att öka produktionen lika snabbt. Samtidigt behöver staten låna för att finansiera en del av åtgärderna.","task":"Vilken risk är mest rimlig utifrån situationen? Välj ett alternativ."},{"title":"När ekonomin förändras","kind":"multi","items":["A. Öka statliga investeringar i skolor och vägar","B. Höja inkomstskatten för hushållen","C. Minska offentliga utgifter omedelbart","D. Sänka inkomstskatten för hushållen"],"correct":[0,3],"explanation":"Ökade offentliga investeringar och sänkt inkomstskatt kan öka efterfrågan. Höjda skatter eller minskade utgifter riskerar i stället att dämpa den.","story":"När finanskrisen spred sig 2008 minskade hushållens konsumtion och företagens investeringar i många länder. Företag fick svårare att sälja sina varor och arbetslösheten steg. Föreställ dig att du är rådgivare åt en regering som vill använda keynesiansk finanspolitik för att motverka nedgången.","task":"Välj de TVÅ åtgärder som tydligast stimulerar efterfrågan."},{"title":"Ett beslut om moms","kind":"arrows","items":["Restaurangpriserna","Efterfrågan på restaurangbesök","Behovet av personal"],"correct":["Minskar","Ökar","Ökar"],"explanation":"Lägre priser kan öka efterfrågan och därmed behovet av personal. I verkligheten beror effekten på hur mycket av momssänkningen som förs över till priserna.","story":"I Sverige sänktes restaurangmomsen från 25 till 12 procent år 2012. Tänk dig en restaurang som väljer att föra över momssänkningen till kunderna genom lägre priser. Fler gäster kan då vilja äta ute, vilket kan påverka behovet av personal.","task":"Välj ÖKAR eller MINSKAR för var och en av de tre effekterna. Utgå från att restaurangen faktiskt sänker priserna."},{"title":"Ett byggprojekt på 1930-talet","kind":"order","items":["A. Konsumtionen ökar i andra företag","B. Staten finansierar ett dammbygge","C. Fler arbetstillfällen uppstår i andra branscher","D. Byggarbetare får lön"],"correct":["B","D","A","C"],"explanation":"Det är multiplikatoreffekten: en första statlig satsning ger inkomster som kan skapa ytterligare efterfrågan och arbetstillfällen.","story":"Under 1930-talets depression genomfördes offentliga projekt i USA inom ramen för New Deal. När staten finansierade byggandet av exempelvis dammar och vägar fick människor arbete. Deras löner kunde sedan användas i butiker och på andra tjänster, vilket i sin tur skapade inkomster för fler.","task":"Placera de fyra händelserna i den ordning de inträffar. Bokstäverna A–D står alltid för samma händelser. Välj en bokstav för varje steg. Alternativen i rullistorna kan visas i olika ordning."},{"title":"Regeringens nästa steg","kind":"words","items":["Typ av finanspolitik","Effekt på efterfrågan"],"correct":["restriktiv","dämpa"],"explanation":"Restriktiv finanspolitik innebär exempelvis höjda skatter eller minskade offentliga utgifter för att dämpa efterfrågan. Godkänns också: ”minska” i andra rutan.","story":"Anta att Sverige befinner sig i en tydlig högkonjunktur. Företagen har svårt att hitta personal, hushållen handlar mycket och priserna stiger snabbt. Regeringen vill enligt keynesiansk teori bromsa utvecklingen för att minska risken för överhettning.","task":"Skriv in de två begrepp som saknas: Staten bör bedriva ____ finanspolitik för att ____ efterfrågan."},{"title":"Stöd under en kris","kind":"match","items":["A. Stöd till företag","B. Stöd vid korttidsarbete","C. Ekonomiskt stöd till hushåll"],"correct":["2","3","1"],"explanation":"A–2: hjälpa företag att överleva. B–3: minska uppsägningar. C–1: hjälpa hushåll att fortsätta konsumera.","story":"När coronapandemin slog till 2020 tappade många företag kunder. I Sverige användes bland annat stöd vid korttidsarbete, som gjorde det möjligt att minska arbetstiden utan att säga upp lika många anställda. Andra stöd riktades till företag och hushåll.","task":"Koppla varje åtgärd till det mest direkta syftet (skriv 1, 2 eller 3)."},{"title":"Två länder – två lägen","kind":"single","items":["Land A – 3 % arbetslöshet, 6 % inflation","Land B – 11 % arbetslöshet, 1 % inflation","Det går inte att välja eftersom länderna har samma arbetslöshet"],"correct":0,"explanation":"Land A har lägre arbetslöshet. Keynesianismen i faktatexten prioriterar att bekämpa arbetslöshet, även om inflationen kan bli något högre.","story":"Land A har 3 % arbetslöshet och 6 % inflation. Land B har 11 % arbetslöshet och 1 % inflation. Enligt den förenklade Phillipskurvan kan låg arbetslöshet sammanfalla med högre inflation. Keynesianismen lägger särskild vikt vid att motverka hög arbetslöshet.","task":"Vilket land skulle en keynesiansk politiker sannolikt föredra om målet är att prioritera LÅG ARBETSLÖSHET, även om inflationen blir högre? Välj ett land."},{"title":"En ny järnväg","kind":"signs","items":["Fler människor får arbete tack vare bygget","Staten får ett större budgetunderskott","Klimatutsläppen minskar om fler väljer tåget i stället för bilen","Efterfrågan ökar hos företag som levererar till bygget"],"correct":["+","−","+","+"],"explanation":"Investeringen kan stimulera jobb och efterfrågan, men kan också öka budgetunderskottet. Klimatnyttan beror på hur järnvägen används och byggs.","story":"Sverige befinner sig i lågkonjunktur och regeringen överväger en ny järnväg. Byggprojektet kan ge arbetstillfällen och öka efterfrågan. Det kostar också pengar för staten och kan på kort sikt bidra till budgetunderskott. På längre sikt kan tåg ersätta vissa bilresor och därmed minska utsläppen.","task":"Markera + om påståendet beskriver en möjlig POSITIV konsekvens av järnvägssatsningen, och − om det beskriver en möjlig NEGATIV konsekvens. Bedöm konsekvensen ur samhällsekonomiskt eller miljömässigt perspektiv."},{"title":"Att planera statens budget","kind":"budget","items":["Lågkonjunktur","Högkonjunktur"],"correct":["A","B"],"explanation":"A = budgetunderskott under lågkonjunktur. B = budgetöverskott under högkonjunktur. Detta är en förenklad beskrivning, inte ett automatiskt utfall.","story":"Föreställ dig att en regering försöker jämna ut konjunktursvängningarna. Under lågkonjunktur satsar den extra pengar för att hålla uppe efterfrågan. När ekonomin senare går starkt vill regeringen i stället spara och bygga upp en buffert inför nästa kris.","task":"Välj vilket budgetutfall som typiskt hör till respektive konjunktur i textens modell."},{"title":"Hushållens ekonomi","kind":"single","items":["A. Ersättningen motverkar ett kraftigt fall i efterfrågan","B. Ersättningen gör att företagen inte behöver anställa","C. Ersättningen gör att staten automatiskt får budgetöverskott"],"correct":0,"explanation":"Arbetslöshetsersättning hjälper till att hålla konsumtionen uppe när arbetslösheten stiger och kan därmed mildra en nedgång.","story":"När arbetslösheten stiger förlorar hushåll inkomster. Men den som får arbetslöshetsersättning kan fortfarande köpa mat och betala en del av sina räkningar. Det gör att butiker och andra företag inte tappar lika mycket försäljning som de annars skulle ha gjort.","task":"Vilket påstående beskriver bäst hur ersättningen kan påverka ekonomin? Välj ett alternativ."},{"title":"Två rapporter till regeringen","kind":"policy","items":["Situation A: stigande arbetslöshet","Situation B: snabbt stigande inflation"],"correct":["E","R"],"explanation":"A: expansiv finanspolitik stimulerar efterfrågan i lågkonjunktur. B: restriktiv finanspolitik dämpar efterfrågan i högkonjunktur.","story":"Du får två rapporter. I situation A stiger arbetslösheten, konsumtionen minskar och företag säger upp personal. I situation B är arbetslösheten mycket låg, konsumtionen ökar snabbt och inflationen stiger. Du ska välja finanspolitik som går emot konjunkturen, inte förstärker den.","task":"Välj rätt politik för varje situation."}],"tf":[{"title":"Begrepp 1","story":"Multiplikatoreffekten innebär att en offentlig investering kan skapa inkomster och ytterligare efterfrågan i flera led.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":0,"explanation":"När anställda får lön och handlar kan även andra företag få ökad försäljning och anställa fler."},{"title":"Begrepp 2","story":"Expansiv finanspolitik innebär att staten minskar sina utgifter eller höjer skatterna för att dämpa efterfrågan.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":1,"explanation":"Det beskriver restriktiv finanspolitik. Expansiv finanspolitik syftar till att öka efterfrågan, exempelvis genom större offentliga utgifter eller sänkta skatter."},{"title":"Begrepp 3","story":"Kontracyklisk stabiliseringspolitik innebär att staten försöker motverka konjunkturens svängningar.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":0,"explanation":"Staten kan stimulera vid lågkonjunktur och dämpa efterfrågan vid högkonjunktur."},{"title":"Begrepp 4","story":"Ett budgetunderskott uppstår när statens inkomster är större än dess utgifter.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":1,"explanation":"Budgetunderskott innebär att utgifterna är större än inkomsterna. Om inkomsterna överstiger utgifterna blir det budgetöverskott."},{"title":"En kommun planerar ett bygge","story":"Under en lågkonjunktur börjar staten bygga en skola. Byggarbetarna får lön och handlar mer i lokala butiker. Det är ett exempel på hur multiplikatoreffekten kan fungera.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":0,"explanation":"Löner från bygget kan leda till konsumtion och därmed ökad efterfrågan även utanför byggbranschen."},{"title":"Ett beslut när ekonomin går starkt","story":"Arbetslösheten är låg, företagen har svårt att hinna leverera och priserna stiger snabbt. Enligt kontracyklisk politik bör staten då öka sina utgifter kraftigt för att driva upp efterfrågan ytterligare.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":1,"explanation":"När ekonomin riskerar överhettning talar kontracyklisk politik för att dämpa efterfrågan, exempelvis genom restriktiv finanspolitik."},{"title":"När en familj förlorar inkomst","story":"Många blir arbetslösa under en kris. Arbetslöshetsersättning kan bidra till att hushållen fortsätter köpa varor och tjänster, vilket motverkar ett kraftigt fall i efterfrågan.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":0,"explanation":"Ersättningen håller uppe en del av hushållens köpkraft och kan mildra lågkonjunkturen."},{"title":"En investering i vägar","story":"Staten bygger fler vägar för att skapa arbetstillfällen. Eftersom satsningen kan ge jobb kommer den automatiskt att minska utsläppen från trafiken.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":1,"explanation":"En satsning kan skapa jobb men ändå öka trafik och utsläpp. Klimatpåverkan beror på vilken investering som görs."},{"title":"Priser och arbetslöshet","story":"Ett land får lägre arbetslöshet samtidigt som löner och efterfrågan stiger. Enligt den förenklade Phillipskurvan kan detta sammanfalla med högre inflation.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":0,"explanation":"I genomgångens förenklade modell kan låg arbetslöshet och stark efterfrågan bidra till högre inflation. Sambandet är inte en naturlag."},{"title":"Efter en ekonomisk nedgång","story":"En regering lånar pengar för att investera under en lågkonjunktur. Det betyder att statsskulden måste fortsätta öka även om ekonomin senare återhämtar sig och staten får större skatteintäkter.","task":"Är påståendet sant eller falskt?","kind":"single","items":["Sant","Falskt"],"correct":1,"explanation":"Underskott kan öka statsskulden på kort sikt, men en senare återhämtning och budgetöverskott kan göra det möjligt att minska skulden."}]};

function show(id){['home','quiz','end'].forEach(k=>$(k).classList.toggle('hidden',k!==id));window.scrollTo(0,0)}
function home(){show('home')}
function start(which){mode=which;index=0;results=[];questions=DATA[which].map(q=>{let choices=q.a?shuffle(q.a.map((text,i)=>({text,id:i}))):q.items?shuffle(q.items.map((text,i)=>({text:text.replace(/^[A-D]\.\s*/,''),id:i,original:text}))):[];if(q.kind==='order'){let expected=q.correct.map(letter=>letter.charCodeAt(0)-65);if(choices.every((x,i)=>x.id===expected[i]))choices.push(choices.shift());}return {...q,choices};});render();show('quiz')}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function updateLiveScore(){const right=results.filter(r=>r.first).length;$('liveScore').textContent=`Antal rätt: ${right} av ${results.length}`;}
function render(){checked=false;attempts=0;updateLiveScore();const q=questions[index],total=questions.length;$('counter').textContent=`Fråga ${index+1} av ${total}`;$('bar').style.width=`${(index+1)/total*100}%`;$('sectiontag').textContent=mode==='review'?'REPETERA':mode==='cases'?'ÖVNINGSUPPGIFTER':'SANT & FALSKT';$('heading').textContent=mode==='review'?q.q:q.title;$('story').classList.toggle('hidden',mode==='review');if(mode!=='review')$('story').textContent=q.story;$('task').textContent=mode==='review'?'Välj ett svar.':q.task;$('answers').replaceChildren();$('feedback').className='feedback hidden';$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').textContent=index===total-1?'Visa resultat och facit →':'Nästa fråga →';
if(mode==='review'||['single','multi'].includes(q.kind)){const multi=q.kind==='multi'&&mode==='cases';q.choices.forEach((o,i)=>{const label=el('label','option');const inp=el('input');inp.type=multi?'checkbox':'radio';inp.name='choice';inp.value=o.id;const t=el('span','',String.fromCharCode(65+i)+'. '+o.text);label.append(inp,t);$('answers').append(label)})}
else if(q.kind==='words'){field('Typ av finanspolitik',0,'input');field('Effekt på efterfrågan',1,'input')}
else if(q.kind==='order'){const defs=el('div','muted');q.items.forEach(t=>defs.append(el('p','',t))); $('answers').append(defs);for(let i=0;i<4;i++)field('Steg '+(i+1),i,'select',shuffle(['A','B','C','D'].map(letter=>({value:letter,text:letter}))))}
else if(q.kind==='match'){const defs=el('p','muted','Syften: 1. Hushållen kan fortsätta konsumera · 2. Företag får hjälp att överleva · 3. Färre behöver sägas upp');$('answers').append(defs);q.choices.forEach((o,i)=>field(o.text,i,'select',[1,2,3].map(n=>({value:String(n),text:String(n)})),o.id))}
else if(q.kind==='arrows'||q.kind==='signs'){q.items.forEach((t,i)=>field(t,i,'select',shuffle((q.kind==='arrows'?['Ökar','Minskar']:['+','−']).map(s=>({value:s,text:s})))))}
else if(q.kind==='budget'){const p=el('p','muted','A = Budgetunderskott · B = Budgetöverskott');$('answers').append(p);q.items.forEach((t,i)=>field(t,i,'select',shuffle(['A','B'].map(s=>({value:s,text:s})))))}
else if(q.kind==='policy'){q.items.forEach((t,i)=>field(t,i,'select',shuffle([{value:'E',text:'Expansiv finanspolitik'},{value:'R',text:'Restriktiv finanspolitik'}])))}
}
function field(labelText,i,kind,options=[],original=i){const row=el('div','field'),label=el('label','',labelText);let input;if(kind==='input'){input=el('input');input.type='text';input.placeholder='Skriv ett begrepp'}else{input=el('select');const blank=el('option','','Välj…');blank.value='';input.append(blank);options.forEach(o=>{const opt=el('option','',o.text);opt.value=o.value;input.append(opt)})}input.dataset.position=i;input.dataset.original=original;row.append(label,input);$('answers').append(row)}
function normalize(x){return String(x).trim().toLocaleLowerCase('sv-SE').replace(/\s+/g,' ')}
function getAnswer(q){if(mode==='review'||['single','multi'].includes(q.kind)){return [...$('answers').querySelectorAll('input:checked')].map(e=>Number(e.value)).sort((a,b)=>a-b)}const fields=[...$('answers').querySelectorAll('input,select')];return fields.map(e=>({value:e.value.trim(),original:Number(e.dataset.original)}))}
function correctText(q){if(mode==='review')return q.a[q.correct];if(q.kind==='single')return q.items[q.correct].replace(/^[A-D]\.\s*/,'');if(q.kind==='multi')return q.correct.map(i=>q.items[i].replace(/^[A-D]\.\s*/,'')).join(' och ');if(q.kind==='words')return 'restriktiv; dämpa (även minska godkänns)';if(q.kind==='order')return q.correct.map(letter=>q.items[letter.charCodeAt(0)-65].replace(/^[A-D]\.\s*/,'')).join(' → ');if(q.kind==='match')return 'Stöd till företag → 2; korttidsarbete → 3; stöd till hushåll → 1';if(q.kind==='arrows'||q.kind==='signs')return q.items.map((x,i)=>x+': '+q.correct[i]).join('; ');if(q.kind==='budget')return 'Lågkonjunktur: A (underskott); högkonjunktur: B (överskott)';if(q.kind==='policy')return 'Situation A: expansiv; situation B: restriktiv'}
function check(){
 if(checked)return;
 const q=questions[index],a=getAnswer(q);
 if(a.length===0||a.some(x=>typeof x==='object'&&x.value==='')){const f=$('feedback');f.className='feedback bad';f.textContent='Fyll i alla svar innan du rättar.';return}
 let ok=false;
 if(mode==='review'||q.kind==='single')ok=a.length===1&&a[0]===q.correct;
 else if(q.kind==='multi')ok=JSON.stringify(a)===JSON.stringify([...q.correct].sort((x,y)=>x-y));
 else if(q.kind==='words')ok=normalize(a[0].value)==='restriktiv'&&['dämpa','minska'].includes(normalize(a[1].value));
 else if(q.kind==='order')ok=a.length===q.correct.length&&new Set(a.map(x=>x.value)).size===a.length&&a.every((x,i)=>x.value===q.correct[i]);
 else if(q.kind==='match')ok=a.every(x=>x.value===q.correct[x.original]);
 else ok=a.every((x,i)=>x.value===q.correct[i]);
 attempts++;
 const f=$('feedback');f.className='feedback '+(ok?'good':'bad');
 // I Sant & Falskt räknas första svaret direkt och eleven går vidare utan att korrigera.
 if(mode==='tf'){
   checked=true;
   results.push({first:ok,attempts:1});
   updateLiveScore();
   f.replaceChildren(
     el('strong','',ok?'✓ Rätt svar!':'✕ Fel svar.'),
     ...(ok?[]:[el('p','',`Rätt svar: ${correctText(q)}.`)]),
     el('p','',q.explanation)
   );
   $('answers').querySelectorAll('input,select').forEach(x=>x.disabled=true);
   $('check').classList.add('hidden');$('next').classList.remove('hidden');
   return;
 }
 if(!ok){f.replaceChildren(el('strong','','✕ Inte riktigt – försök igen!'),el('p','','Ändra ditt svar och rätta igen för att gå vidare.'));return;}
 checked=true;results.push({first:attempts===1,attempts});
 updateLiveScore();
 f.replaceChildren(el('strong','','✓ Rätt svar!'),el('p','',q.why||q.explanation));
 $('answers').querySelectorAll('input,select').forEach(x=>x.disabled=true);
 $('check').classList.add('hidden');$('next').classList.remove('hidden');
}
function next(){if(!checked)return;index++;if(index<questions.length){render();window.scrollTo(0,0)}else finish()}
function finish(){
 const score=results.filter(r=>r.first).length;
 $('score').textContent=`Resultat: ${score} av ${questions.length} poäng`;
 $('message').textContent='Här kan du se facit och förklaringar till frågorna.';
 $('key').replaceChildren();questions.forEach((q,i)=>{const d=el('div','reviewitem');d.append(el('strong','',`${i+1}. ${mode==='review'?q.q:q.title}`),el('p','','Rätt svar: '+correctText(q)),el('p','muted',q.why||q.explanation));$('key').append(d)});show('end')
}
</script></body></html>
